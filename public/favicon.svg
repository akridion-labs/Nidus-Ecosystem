<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" role="img" aria-label="Nidus">
  <!-- Nidus is Latin for nest. Three arcs make the nest; the mark resting in it
       is both the egg and the round of a closed book's spine. One colour, no
       gradient, legible at 16px. -->
  <rect width="32" height="32" rx="7" fill="#14625a"/>
  <g fill="none" stroke="#f5f1ea" stroke-linecap="round">
    <path d="M6 17a10 7 0 0 0 20 0" stroke-width="2.1"/>
    <path d="M9 15.5a7 5.5 0 0 0 14 0" stroke-width="1.7" opacity=".75"/>
    <path d="M12 14.2a4 3.4 0 0 0 8 0" stroke-width="1.4" opacity=".5"/>
  </g>
  <circle cx="16" cy="11" r="2.6" fill="#f7efe2"/>
</svg>
