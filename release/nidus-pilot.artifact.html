<!--
      The cold open, in static HTML.

      The module script below is deferred, so this paints before any JavaScript
      parses — on mobile data that is the difference between a headline and a
      blank screen. React replaces it wholesale on mount with the identical
      markup, so there is no flash of different content and no hydration to get
      wrong. It is also what a crawler and a JS-disabled browser see.

      It must stay in step with OPENINGS[0] in src/App.tsx. A test asserts it.
    -->

      <div class="min-h-dvh bg-paper">
        <div class="relative z-[1] mx-auto max-w-[76rem] px-4 sm:px-6 lg:px-10">

            <div class="flex flex-wrap items-baseline justify-between gap-2">
              <span class="inline-flex items-center gap-2 text-accent">
                <svg width="22" height="22" viewBox="0 0 32 32" aria-hidden class="shrink-0 overflow-visible">
                  <g fill="none" stroke="currentColor" stroke-linecap="round">
                    <path d="M4 18a12 8 0 0 0 24 0" stroke-width="2.2"/>
                    <path d="M7.5 16.2a8.5 6 0 0 0 17 0" stroke-width="1.8" opacity=".7"/>
                    <path d="M11 14.6a5 4 0 0 0 10 0" stroke-width="1.5" opacity=".45"/>

                </svg>
                <span class="text-[1.375rem] leading-none" style="font-family:var(--font-display);letter-spacing:.16em">NIDUS</span>
              </span>
              <p class="label-caps text-muted">One book · not a reading list</p>
            </div>
            <div class="grid items-center gap-8 lg:grid-cols-12 lg:gap-12">
              <div class="lg:col-span-7">
                <h1 class="display mt-10 max-w-[16ch] text-[clamp(2.5rem,9vw,5rem)]">What are you building?</h1>
                <p class="mt-5 max-w-[52ch] text-[17px] text-muted">Nidus gives you one book for where you actually are, shows the arithmetic that chose it, and tells you what the book cannot do.</p>
              </div>

                <div class="w-full max-w-[13rem] sm:max-w-[18rem] lg:max-w-[22rem]" style="aspect-ratio:300/260"></div>
              </div>
            </div>
          </header>
